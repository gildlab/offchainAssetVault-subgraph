name: Deploy subgraph
on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network to deploy to"
        required: true
        type: choice
        options:
          - arbitrum-one
          - arbitrum_sepolia
          - avalanche
          - base
          - bsc
          - mainnet
          - hyperevm
          - flare
          - mumbai
          - oasis_sapphire
          - matic
          - sepolia
          - songbird
          - linea
jobs:
  deploy:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    env:
      GOLDSKY_TOKEN: ${{ secrets.CI_GOLDSKY_TOKEN }}
      SUBGRAPH_NAME: sft-${{ inputs.network }}
      KEEP_VERSION: ${{ github.sha }}
      MAX_VERSIONS: "2"
      MIGRATION_HOURS: "24"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      # Align with raindex deploy-subgraph: avoid Determinate magic-nix-cache post
      # uploads that can cancel the job after a successful Goldsky deploy.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
      - uses: cachix/cachix-action@v15
        continue-on-error: true
        with:
          name: rainlanguage
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G
      - run: nix develop -c rainix-sol-prelude
      - run: ./prep-ethgild.sh
      - run: nix develop -c graph codegen
      - run: nix develop -c graph build --network ${{ inputs.network }}
      - run: nix develop -c goldsky login --token ${{ secrets.CI_GOLDSKY_TOKEN }}
      # Check if the repo is clean before deploying.
      - run: git diff --exit-code -- . ":(exclude)subgraph.yaml"
      - run: >
          nix develop -c goldsky subgraph deploy "${{ env.SUBGRAPH_NAME }}/${{ env.KEEP_VERSION }}"

      # RAI-1962: keep at most 2 always-on versions per chain; fail loudly if not.
      - name: Enforce Goldsky version cap
        run: |
          set -euo pipefail

          list_versions() {
            local raw
            raw="$(nix develop -c goldsky subgraph list "$SUBGRAPH_NAME" --filter deployments --color=false 2>&1 || true)"
            printf '%s\n' "$raw" >&2
            printf '%s\n' "$raw" |
              sed 's/\x1b\[[0-9;]*m//g' |
              grep -oE "${SUBGRAPH_NAME}/[^[:space:]│|]+" |
              sed "s|^${SUBGRAPH_NAME}/||" |
              sed 's/[^A-Za-z0-9._-]//g' |
              awk 'NF' |
              sort -u
          }

          version_epoch() {
            local version="$1" detail created
            detail="$(nix develop -c goldsky subgraph list "${SUBGRAPH_NAME}/${version}" --filter deployments --color=false 2>/dev/null || true)"
            created="$(
              printf '%s\n' "$detail" |
                sed 's/\x1b\[[0-9;]*m//g' |
                grep -oiE '(created([ _]at)?|created):[[:space:]]*[0-9T:Z.+-]+' |
                head -n1 |
                grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}[^[:space:]]*' || true
            )"
            if [[ -n "$created" ]]; then
              date -u -d "$created" +%s 2>/dev/null || echo 0
            else
              echo 0
            fi
          }

          mapfile -t VERSIONS < <(list_versions)
          if [[ ${#VERSIONS[@]} -eq 0 ]]; then
            echo "No deployments found for ${SUBGRAPH_NAME}."
            exit 0
          fi

          # Prefer keep version, then newer created_at, then version string.
          ROWS=()
          for version in "${VERSIONS[@]}"; do
            epoch="$(version_epoch "$version")"
            priority=0
            [[ "$version" == "$KEEP_VERSION" ]] && priority=2
            ROWS+=("${priority}|${epoch}|${version}")
          done
          mapfile -t SORTED < <(printf '%s\n' "${ROWS[@]}" | sort -t'|' -k1,1nr -k2,2nr -k3,3r)

          echo "Live versions (${#SORTED[@]}):"
          for row in "${SORTED[@]}"; do
            echo "  - ${SUBGRAPH_NAME}/${row##*|}"
          done

          if [[ ${#SORTED[@]} -gt $MAX_VERSIONS ]]; then
            for ((i = MAX_VERSIONS; i < ${#SORTED[@]}; i++)); do
              stale="${SORTED[$i]##*|}"
              echo "Deleting ${SUBGRAPH_NAME}/${stale}"
              nix develop -c goldsky subgraph delete "${SUBGRAPH_NAME}/${stale}" --force --color=false
            done

            mapfile -t VERSIONS < <(list_versions)
            ROWS=()
            for version in "${VERSIONS[@]}"; do
              epoch="$(version_epoch "$version")"
              priority=0
              [[ "$version" == "$KEEP_VERSION" ]] && priority=2
              ROWS+=("${priority}|${epoch}|${version}")
            done
            mapfile -t SORTED < <(printf '%s\n' "${ROWS[@]}" | sort -t'|' -k1,1nr -k2,2nr -k3,3r)

            echo "After cleanup (${#SORTED[@]}):"
            for row in "${SORTED[@]}"; do
              echo "  - ${SUBGRAPH_NAME}/${row##*|}"
            done
          fi

          if [[ ${#SORTED[@]} -gt $MAX_VERSIONS ]]; then
            echo "::error title=Goldsky version cap exceeded::${SUBGRAPH_NAME} has ${#SORTED[@]} live versions; max allowed is ${MAX_VERSIONS}."
            exit 1
          fi

          if [[ ${#SORTED[@]} -eq 2 ]]; then
            newer="${SORTED[0]##*|}"
            older="${SORTED[1]##*|}"
            newer_epoch="$(echo "${SORTED[0]}" | cut -d'|' -f2)"
            now_epoch="$(date -u +%s)"
            limit_seconds=$((MIGRATION_HOURS * 3600))
            if [[ "$newer_epoch" -gt 0 && $((now_epoch - newer_epoch)) -gt $limit_seconds ]]; then
              echo "::error title=Goldsky migration overlap >${MIGRATION_HOURS}h::${SUBGRAPH_NAME} still has 2 live versions after ${MIGRATION_HOURS}h (${newer} and ${older})."
              exit 1
            fi
            echo "Two versions present; keep=${KEEP_VERSION}. Migration window OK."
          fi

          echo "Version cap OK for ${SUBGRAPH_NAME}."
      - name: Forward CI status to Telegram
        if: always()
        uses: rainlanguage/github-chore/.github/actions/telegram-status-report@main
        with:
          status: ${{ job.status }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: "${{ env.SUBGRAPH_NAME }}/${{ env.KEEP_VERSION }}"
