name: Deploy subgraph
on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network to deploy to"
        required: true
        type: choice
        options:
          - arbitrum-one
          - arbitrum_sepolia
          - avalanche
          - base
          - bsc
          - mainnet
          - flare
          - mumbai
          - oasis_sapphire
          - matic
          - sepolia
          - songbird
          - linea
      version:
        description: "Goldsky subgraph version (e.g. 1.0.14). Current base is 1.0.13 — bump when deploying."
        required: true
        type: string
jobs:
  deploy:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      # Align with raindex deploy-subgraph: avoid Determinate magic-nix-cache post
      # uploads that can cancel the job after a successful Goldsky deploy.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
      - uses: cachix/cachix-action@v15
        continue-on-error: true
        with:
          name: rainlanguage
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G
      - run: nix develop -c rainix-sol-prelude
      - run: ./prep-ethgild.sh
      - run: nix develop -c graph codegen
      - run: nix develop -c graph build --network ${{ inputs.network }}
      - run: nix develop -c goldsky login --token ${{ secrets.CI_GOLDSKY_TOKEN }}
      # Check if the repo is clean before deploying.
      - run: git diff --exit-code -- . ":(exclude)subgraph.yaml"
      - run: >
          nix develop -c goldsky subgraph deploy "sft-${{ inputs.network }}/${{ inputs.version }}"

