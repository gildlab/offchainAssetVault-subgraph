name: Goldsky version cap check
# RAI-1962: catch forgotten migration overlaps (>2 versions, or 2 versions for >24h)
# without waiting for the next deploy.
on:
  schedule:
    # Daily 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      GOLDSKY_TOKEN: ${{ secrets.CI_GOLDSKY_TOKEN }}
      MAX_VERSIONS: "2"
      MIGRATION_HOURS: "24"
    steps:
      - uses: actions/checkout@v4
      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
      - uses: cachix/cachix-action@v15
        continue-on-error: true
        with:
          name: rainlanguage
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G
      - run: nix develop -c goldsky login --token ${{ secrets.CI_GOLDSKY_TOKEN }}
      - name: Check version caps for configured networks
        run: |
          set -euo pipefail

          list_versions() {
            local name="$1" raw
            raw="$(nix develop -c goldsky subgraph list "$name" --filter deployments --color=false 2>&1 || true)"
            printf '%s\n' "$raw" >&2
            printf '%s\n' "$raw" |
              sed 's/\x1b\[[0-9;]*m//g' |
              grep -oE "${name}/[^[:space:]│|]+" |
              sed "s|^${name}/||" |
              sed 's/[^A-Za-z0-9._-]//g' |
              awk 'NF' |
              sort -u
          }

          version_epoch() {
            local name="$1" version="$2" detail created
            detail="$(nix develop -c goldsky subgraph list "${name}/${version}" --filter deployments --color=false 2>/dev/null || true)"
            created="$(
              printf '%s\n' "$detail" |
                sed 's/\x1b\[[0-9;]*m//g' |
                grep -oiE '(created([ _]at)?|created):[[:space:]]*[0-9T:Z.+-]+' |
                head -n1 |
                grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}[^[:space:]]*' || true
            )"
            if [[ -n "$created" ]]; then
              date -u -d "$created" +%s 2>/dev/null || echo 0
            else
              echo 0
            fi
          }

          check_network() {
            local name="$1"
            local -a versions rows sorted
            mapfile -t versions < <(list_versions "$name")
            if [[ ${#versions[@]} -eq 0 ]]; then
              echo "No deployments found for ${name}."
              return 0
            fi

            rows=()
            for version in "${versions[@]}"; do
              rows+=("$(version_epoch "$name" "$version")|${version}")
            done
            mapfile -t sorted < <(printf '%s\n' "${rows[@]}" | sort -t'|' -k1,1nr -k2,2r)

            echo "Live versions (${#sorted[@]}):"
            for row in "${sorted[@]}"; do
              echo "  - ${name}/${row##*|}"
            done

            if [[ ${#sorted[@]} -gt $MAX_VERSIONS ]]; then
              echo "::error title=Goldsky version cap exceeded::${name} has ${#sorted[@]} live versions; max allowed is ${MAX_VERSIONS}."
              return 1
            fi

            if [[ ${#sorted[@]} -eq 2 ]]; then
              local newer older newer_epoch now_epoch limit_seconds
              newer="${sorted[0]##*|}"
              older="${sorted[1]##*|}"
              newer_epoch="$(echo "${sorted[0]}" | cut -d'|' -f1)"
              older_epoch="$(echo "${sorted[1]}" | cut -d'|' -f1)"
              now_epoch="$(date -u +%s)"
              limit_seconds=$((MIGRATION_HOURS * 3600))

              if [[ "$newer_epoch" -gt 0 && $((now_epoch - newer_epoch)) -gt $limit_seconds ]]; then
                echo "::error title=Goldsky migration overlap >${MIGRATION_HOURS}h::${name} still has 2 live versions after ${MIGRATION_HOURS}h (${newer} and ${older})."
                return 1
              fi
              if [[ "$newer_epoch" -eq 0 && "$older_epoch" -eq 0 ]]; then
                echo "::error title=Goldsky migration overlap unknown age::${name} has 2 live versions and creation times could not be parsed."
                return 1
              fi
              if [[ "$newer_epoch" -eq 0 && "$older_epoch" -gt 0 && $((now_epoch - older_epoch)) -gt $limit_seconds ]]; then
                echo "::error title=Goldsky migration overlap >${MIGRATION_HOURS}h::${name} still has 2 live versions and the older one is >${MIGRATION_HOURS}h old (${older})."
                return 1
              fi
            fi

            echo "Version cap OK for ${name}."
          }

          failed=0
          while IFS= read -r network; do
            echo "::group::sft-${network}"
            if ! check_network "sft-${network}"; then
              failed=1
            fi
            echo "::endgroup::"
          done < <(jq -r 'keys[]' networks.json)
          exit "$failed"
      - name: Forward CI status to Telegram
        if: always()
        uses: rainlanguage/github-chore/.github/actions/telegram-status-report@main
        with:
          status: ${{ job.status }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: "Goldsky version cap / 24h migration check"
